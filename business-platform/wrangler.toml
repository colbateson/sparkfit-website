name = "sparkfit-business-platform-staging"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
ENVIRONMENT = "staging"
PUBLIC_APP_ORIGIN = "https://spark-fit.com"
PILOT_DEFAULT_DAYS = "30"
PILOT_MAX_SEATS = "20"
PAYMENTS_ENABLED = "false"
REVENUECAT_WRITES_ENABLED = "false"
EMAIL_ENABLED = "false"
TURNSTILE_REQUIRED = "false"
TURNSTILE_SITE_KEY = ""
RATE_LIMITING_ENABLED = "true"
REQUIRE_APP_ACCOUNT_FOR_BUSINESS = "false"
ADMIN_EMAILS = ""
PRICING_VERSION = "annual-v1-preview"

[[d1_databases]]
binding = "DB"
database_name = "sparkfit-business-staging"
database_id = "916e9abf-845e-46e0-b395-b36e4b55c03d"
migrations_dir = "migrations"

[triggers]
crons = ["15 8 * * *"]
