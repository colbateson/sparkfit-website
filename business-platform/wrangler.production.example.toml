name = "sparkfit-business-platform-production"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
LAUNCH_ENABLED = "false"
RETENTION_ENABLED = "false"
PUBLIC_APP_ORIGIN = "https://business.spark-fit.com"
SERVICE_ORIGIN = "https://business.spark-fit.com"
STRIPE_AUTOMATIC_TAX_ENABLED = "false"
STRIPE_MANAGED_PAYMENTS_ENABLED = "true"
STRIPE_API_VERSION = "2026-10-28.endive"
STRIPE_PRODUCT_ID = "replace_with_live_product_id"
STRIPE_PORTAL_CONFIGURATION_ID = "replace_with_live_portal_configuration_id"
PILOT_DEFAULT_DAYS = "30"
PILOT_MAX_SEATS = "20"
PAYMENTS_ENABLED = "false"
REVENUECAT_WRITES_ENABLED = "false"
EMAIL_ENABLED = "false"
TURNSTILE_REQUIRED = "true"
TURNSTILE_SITE_KEY = "replace_with_turnstile_site_key"
TURNSTILE_ALLOWED_HOSTNAMES = "business.spark-fit.com"
RATE_LIMITING_ENABLED = "true"
REQUIRE_APP_ACCOUNT_FOR_BUSINESS = "true"
ADMIN_EMAILS = "approved.admin@spark-fit.com"
PRICING_VERSION = "annual-v1"
REVENUECAT_PROJECT_ID = "replace_with_project_id"
REVENUECAT_BUSINESS_ENTITLEMENT_ID = "replace_with_entitlement_id"
EMAIL_FROM = "SparkFit Partnerships <partnerships@mail.spark-fit.com>"
EMAIL_REPLY_TO = "partnerships@spark-fit.com"
PARTNERSHIPS_EMAIL = "partnerships@spark-fit.com"

[[d1_databases]]
binding = "DB"
database_name = "sparkfit-business-production"
database_id = "replace_with_production_d1_database_id"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]
